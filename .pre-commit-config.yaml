repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json, yaml, markdown]
        files: ^frontend/src/

  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: bash -c 'cd backend && python -m pytest tests/ -x -q --tb=short'
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false

      - id: frontend-typecheck
        name: TypeScript typecheck (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/src/
        types: [ts, tsx]
        pass_filenames: false

      - id: frontend-lint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/src/
        types: [ts, tsx]
        pass_filenames: false

      - id: frontend-format
        name: Prettier check (frontend)
        entry: bash -c 'cd frontend && npx prettier --check "src/**/*.{ts,tsx,css,json}"'
        language: system
        files: ^frontend/src/
        types: [ts, tsx]
        pass_filenames: false

      - id: frontend-test
        name: Vitest (frontend)
        entry: bash -c 'cd frontend && npx vitest run --reporter=verbose'
        language: system
        files: ^frontend/src/
        types: [ts, tsx]
        pass_filenames: false
